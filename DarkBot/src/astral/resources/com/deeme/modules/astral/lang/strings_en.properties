astral_gate=Astral gate
astral_gate.desc=Automates Astral travel, ship selection, rewards, portals, and combat.
astral_gate.radius_min=Orbit radius
astral_gate.radius_min.desc=Preferred distance to keep while fighting NPCs.
astral_gate.min_cpus=Minimum Astral CPUs to keep
astral_gate.min_cpus.desc=If the available CPU count is at or below this value, the module waits instead of starting another gate.
astral_gate.default_laser=Default laser
astral_gate.default_laser.desc=Fallback laser to use when no special ammo should be selected.
astral_gate.default_rocket=Default rocket
astral_gate.default_rocket.desc=Rocket to keep selected while fighting.
astral_gate.always_closest_npc=Always attack the closest NPC
astral_gate.always_closest_npc.desc=Disable smart target priority and always pick the nearest NPC.
astral_gate.min_shield_to_repair=Minimum shield to repair
astral_gate.min_shield_to_repair.desc=Start kiting and preserving shields when shield drops below this threshold.
astral_gate.use_best_ammo_logic=Ammo logic
astral_gate.use_best_ammo_logic.desc=Controls how aggressively the module upgrades ammo during fights.
astral_gate.use_best_ammo_logic.list.always=Always best ammo
astral_gate.use_best_ammo_logic.list.always.desc=Always use the strongest available ammo path for Astral fights.
astral_gate.use_best_ammo_logic.list.special_logic=Smart ammo logic
astral_gate.use_best_ammo_logic.list.special_logic.desc=Use stronger ammo on dangerous or finishing situations.
astral_gate.use_best_ammo_logic.list.only_marked=Default ammo only
astral_gate.use_best_ammo_logic.list.only_marked.desc=Only use the configured default laser.
astral_gate.ship_type=Ship type
astral_gate.ship_type.desc=Ship to select when the Astral ship selection window appears.
astral_gate.ship_type.list.zephyr=Zephyr
astral_gate.ship_type.list.diminisher=Diminisher
astral_gate.ship_type.list.sentinel=Sentinel
astral_gate.ship_type.list.pusat=Pusat
astral_gate.auto_choose=Auto choose rewards and portals
astral_gate.auto_choose.desc=Automatically pick reward cards and the next Astral portal.
astral_gate.chase_low_hp_npcs=Chase low-HP NPCs
astral_gate.chase_low_hp_npcs.desc=Aggressively follow fleeing NPCs when they are close to death so waves finish faster.
astral_gate.low_hp_chase_threshold=Low-HP chase threshold
astral_gate.low_hp_chase_threshold.desc=NPCs at or below this HP percent are chased more aggressively.
astral_gate.max_deaths=Max deaths per session
astral_gate.max_deaths.desc=Stop the module after this many deaths. Set to 0 to disable.
astral_gate.max_runs=Max runs per session
astral_gate.max_runs.desc=Stop the module after completing this many Astral runs. Set to 0 to disable.
astral_gate.use_ship_ability=Use ship ability
astral_gate.use_ship_ability.desc=Automatically activate the ship's special ability during combat.
astral_gate.use_formations=Use formations
astral_gate.use_formations.desc=Dynamically switch formations based on combat situation (defensive when low HP, offensive when safe).
astral_gate.use_pet=Use PET in Astral
astral_gate.use_pet.desc=Enable and manage PET during Astral combat. Disables PET outside astral.
astral_gate.min_rift_for_brutal=Min rift for brutal portals
astral_gate.min_rift_for_brutal.desc=Only enter brutal portals after reaching this rift level. Set to 0 to always allow brutal.
astral_gate.portal_infos=Portal priorities
astral_gate.portal_infos.desc=Priority order and entry limits for Astral portal types.
astral_gate.portal_infos.entry=Portal
astral_gate.portal_infos.entry.priority=Priority
astral_gate.portal_infos.entry.priority.desc=Lower values are preferred first.
astral_gate.portal_infos.entry.ignore_limit=Ignore item limits
astral_gate.portal_infos.entry.ignore_limit.desc=Enter this portal even if the normal inventory limit would suggest skipping it.
astral_gate.custom_item_priority=Custom item priority
astral_gate.custom_item_priority.desc=Override the default reward priority tables.
astral_gate.custom_item_priority.active=Enable custom item priority
astral_gate.custom_item_priority.active.desc=Use the custom item priority table instead of the built-in reward order.
astral_gate.custom_item_priority.item_infos=Reward priorities
astral_gate.custom_item_priority.item_infos.desc=Custom priority per reward item id.
astral_gate.custom_item_priority.item_infos.entry=Item
astral_gate.custom_item_priority.item_infos.entry.priority=Priority
astral_gate.custom_item_priority.item_infos.entry.priority.desc=Lower values are preferred first.
astral_gate.astral_plus_config=Astral UI timing
astral_gate.astral_plus_config.desc=Timing values for reward and ship selection clicks.
astral_gate.astral_plus_config.min_time_per_action=Minimum time per action
astral_gate.astral_plus_config.min_time_per_action.desc=Base delay, in tenths of a second, between Astral UI actions.
astral_gate.astral_plus_config.enable_random=Randomize click timing
astral_gate.astral_plus_config.enable_random.desc=Adds a small random delay to UI actions.

nearest_ship_locker=Nearest ship locker
nearest_ship_locker.desc=Tutucu-style lock helper that keeps the nearest valid ship selected and locked.
nearest_ship_locker.enabled=Enabled
nearest_ship_locker.enabled.desc=Enable nearest ship locking behavior.
nearest_ship_locker.enemy_only=Enemy only
nearest_ship_locker.enemy_only.desc=Only target ships considered enemies.
nearest_ship_locker.ignore_invisible=Ignore invisible ships
nearest_ship_locker.ignore_invisible.desc=Skip cloaked or invisible ships.
nearest_ship_locker.include_pets=Include pets
nearest_ship_locker.include_pets.desc=Allow PET targets in nearest search.
nearest_ship_locker.auto_lock=Auto lock target
nearest_ship_locker.auto_lock.desc=Continuously try to lock the selected ship.
nearest_ship_locker.sticky_target=Sticky target
nearest_ship_locker.sticky_target.desc=Keep current valid target instead of retargeting each scan.
nearest_ship_locker.clear_when_empty=Clear target when empty
nearest_ship_locker.clear_when_empty.desc=Clear attack/local target when no valid ship is found.
nearest_ship_locker.max_range=Maximum range
nearest_ship_locker.max_range.desc=Only consider ships within this distance. Set 0 to disable range limit.
nearest_ship_locker.refresh_ms=Refresh interval (ms)
nearest_ship_locker.refresh_ms.desc=How often nearest ship search runs.
